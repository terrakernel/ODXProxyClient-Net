# cbindgen configuration for the odxclient C ABI.
#
# The .NET binding uses [LibraryImport] and does NOT consume this header — it exists
# only for C/C++ consumers of odxclient.dll. The header is generated MANUALLY (not in
# the build) and checked in. Regenerate after changing the FFI surface:
#
#   cbindgen --config cbindgen.toml --crate odxclient --output include/odxclient.h
#
language = "C"
include_guard = "ODXCLIENT_H"
cpp_compat = true          # wrap in extern "C" so C++ can include it
tab_width = 4
documentation = true       # carry the Rust /// docs into the header
documentation_style = "c99"
usize_is_size_t = true     # usize -> size_t for lengths/capacities

header = """
/*
 * odxclient — C ABI for the odxproxy client core (odxclient.dll).
 *
 * GENERATED by cbindgen from the Rust source — DO NOT EDIT BY HAND.
 * Regenerate: cbindgen --config cbindgen.toml --crate odxclient --output include/odxclient.h
 *
 * For C/C++ consumers only; the .NET binding uses [LibraryImport]. Target is
 * Windows x86_64 (x86_64-pc-windows-msvc). ClientInner / OdxRequest / OdxBuffer are
 * opaque handles — never dereference them. See IMPLEMENTATION-PLAN.md for lifecycle.
 */
"""

[parse]
parse_deps = false         # only our crate; never walk reqwest/tokio

[enum]
prefix_with_name = true    # OdxStatus_Ok, ... — avoid polluting the C global namespace
